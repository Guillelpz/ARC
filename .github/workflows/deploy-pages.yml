name: Deploy Pages
# Publica en cada push a main que toque app/ o este archivo, y a mano (Run workflow) con el input sw_kill = kill switch. Ver docs/DEPLOY.md.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
    inputs:
      sw_kill:
        description: 'Emergencia: publicar un sw.js que desinstala el service worker'
        type: boolean
        default: false
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    # cosmético: un workflow_dispatch desde otra rama ejecuta el YAML de esa rama. La protección real es el entorno github-pages limitado a main (DEPLOY.md)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      # lint, test y e2e = puerta antes de publicar; con sw_kill se saltan (en una emergencia nada debe bloquear el kill switch). El humo final se ejecuta siempre
      - if: ${{ !inputs.sw_kill }}
        run: npm run lint
      - if: ${{ !inputs.sw_kill }}
        run: npm test
      - if: ${{ !inputs.sw_kill }}
        run: npx playwright install --with-deps chromium
      - if: ${{ !inputs.sw_kill }}
        run: npm run e2e
      - run: |
          echo "SW_KILL=[$SW_KILL]"
          npm run build
        env: { BASE_PATH: '/${{ github.event.repository.name }}/', SW_KILL: "${{ inputs.sw_kill && '1' || '' }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
      # humo: compara la primera línea de sw.js (BUILD_ID, ASSETS, KILL), no el fichero entero. También con sw_kill. Va después del deploy, así que no bloquea nada; si falla, el job sale en rojo
      - name: Humo (la URL publicada sirve este build)
        run: |
          url='${{ steps.deployment.outputs.page_url }}'
          want=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          [ -n "$want" ] || { echo "::error::dist/index.html no referencia assets/index-*.js"; exit 1; }
          for i in 1 2 3 4 5; do
            got=$(curl -fsS "${url}?smoke=${GITHUB_RUN_ID}-$i" | grep -o 'assets/index-[^"]*\.js' | head -1) || true
            if [ "$got" = "$want" ] && [ "$(curl -fsS "${url}sw.js?smoke=${GITHUB_RUN_ID}-$i" | head -1)" = "$(head -1 dist/sw.js)" ]; then echo "Humo OK: $want"; exit 0; fi
            echo "Intento $i/5: publicado '$got', esperado '$want' (o sw.js distinto)"; sleep 10
          done
          echo "::error::Humo: la URL publicada no sirve este build. Ver docs/DEPLOY.md «Volver atrás»"; exit 1
