name: Deploy Pages
# Desactivado: solo manual (input sw_kill = kill switch del service worker, ver docs/DEPLOY.md). Para activarlo tras elegir GitHub Pages, añadir `push: { branches: [main] }` (ver docs/DEPLOY.md).
on:
  workflow_dispatch:
    inputs:
      sw_kill:
        description: 'Emergencia: publicar un sw.js que desinstala el service worker'
        type: boolean
        default: false
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: { BASE_PATH: '/${{ github.event.repository.name }}/', SW_KILL: "${{ inputs.sw_kill && '1' || '' }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
