developer_instructions = '''
## Adaptación a Codex

- Sigue las instrucciones del usuario y AGENTS.md.
- Usa las herramientas de lectura, búsqueda y escritura disponibles en Codex; no dependas de nombres de herramientas propios de Claude. Trabaja solo en los archivos asignados y no inicies otros agentes sin encargo explícito del agente principal.
